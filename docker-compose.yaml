services:
  web:
    container_name: casa-do-hamburguer-app
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ray-matias/casa-do-hamburguer:1.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./node_modules/.prisma:/app/node_modules/.prisma
      - ./node_modules/@prisma:/app/node_modules/@prisma
    environment:
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgres://admin:adm123@postgres-db:5432/hamburgueria_db

  postgres-db:
    container_name: casa-do-hamburguer-db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adm123
      POSTGRES_DB: hamburgueria_db